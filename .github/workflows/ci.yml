name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CI calls Makefile targets (BusinessRepo convention): vet + gofmt check,
      # race tests, and a build.
      - name: CI gate
        run: make ci
